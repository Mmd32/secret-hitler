<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
  <defs>
    <filter id="card-back-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#222831" surfaceScale="1.4" result="light">
        <feDistantLight azimuth="45" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Intricate Guilloche / Crosshatch Pattern -->
    <pattern id="guilloche" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 30 30 M 30 0 L 0 30" stroke="#2D3748" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="none" stroke="#3A4759" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="10" y="10" width="730" height="1030" rx="30" ry="30" fill="#181E26" stroke="#0D1117" stroke-width="6" filter="url(#card-back-texture)" />

  <!-- Outer Ornate Gold Border -->
  <rect x="35" y="35" width="680" height="980" rx="22" ry="22" fill="none" stroke="#C49B5A" stroke-width="5" />
  <rect x="50" y="50" width="650" height="950" rx="16" ry="16" fill="url(#guilloche)" stroke="#C49B5A" stroke-width="2" />

  <!-- Corner Badges -->
  <g fill="#C49B5A">
    <circle cx="50" cy="50" r="10" />
    <circle cx="700" cy="50" r="10" />
    <circle cx="50" cy="1000" r="10" />
    <circle cx="700" cy="1000" r="10" />
  </g>

  <!-- Center Archival Emblem -->
  <g transform="translate(375, 525)">
    <!-- Heavy Oval Medallion -->
    <ellipse cx="0" cy="0" rx="200" ry="260" fill="#13171F" stroke="#C49B5A" stroke-width="6" />
    <ellipse cx="0" cy="0" rx="180" ry="240" fill="none" stroke="#C49B5A" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Top & Bottom Ribbon Texts -->
    <text x="0" y="-170" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" letter-spacing="8" fill="#C49B5A" text-anchor="middle">STRENG GEHEIM</text>
    <line x1="-120" y1="-150" x2="120" y2="-150" stroke="#C49B5A" stroke-width="2" />

    <!-- Center Icon: Secret Dossier Insignia -->
    <path d="M0 -90 L30 -30 L90 -40 L50 15 L80 80 L15 50 L0 100 L-15 50 L-80 80 L-50 15 L-90 -40 L-30 -30 Z" fill="#C49B5A" />
    <circle cx="0" cy="-25" r="24" fill="#13171F" stroke="#C49B5A" stroke-width="3" />

    <line x1="-120" y1="140" x2="120" y2="140" stroke="#C49B5A" stroke-width="2" />
    <text x="0" y="175" font-family="Georgia, serif" font-size="20" font-weight="bold" letter-spacing="8" fill="#C49B5A" text-anchor="middle">SECRET HITLER</text>
    <text x="0" y="205" font-family="'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#889BB0" text-anchor="middle">BERLIN 1932</text>
  </g>
</svg>

