<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
  <defs>
    <filter id="leather-liberal" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#244B5C" surfaceScale="1.6" result="light">
        <feDistantLight azimuth="45" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Textured Book Cover -->
  <rect x="10" y="10" width="730" height="1030" rx="28" ry="28" fill="#1C3845" stroke="#10252E" stroke-width="6" filter="url(#leather-liberal)" />

  <!-- Gold Embossed Border -->
  <rect x="45" y="45" width="660" height="960" rx="18" ry="18" fill="none" stroke="#D3B775" stroke-width="6" />
  <rect x="60" y="60" width="630" height="930" rx="12" ry="12" fill="none" stroke="#D3B775" stroke-width="2" stroke-dasharray="10 5" />

  <!-- Top Inscription -->
  <text x="375" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="8" fill="#D3B775" text-anchor="middle">DEUTSCHER REICHSTAG</text>
  <text x="375" y="185" font-family="'Times New Roman', serif" font-size="18" letter-spacing="4" fill="#95B5C4" text-anchor="middle">PARTEIMITGLIEDSCHAFT • AUSWEIS</text>
  <line x1="180" y1="210" x2="570" y2="210" stroke="#D3B775" stroke-width="2" />

  <!-- Center Gold Foil Seal -->
  <g transform="translate(375, 460) scale(1.1)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#D3B775" stroke-width="4" />
    <circle cx="0" cy="0" r="145" fill="#162F3B" stroke="#D3B775" stroke-width="1.5" stroke-dasharray="6 4" />
    <!-- Classical scales of justice / freedom torch -->
    <path d="M-60 -50 L60 -50 M0 -90 L0 80 M-60 -50 L-90 20 L-30 20 Z M60 -50 L30 20 L90 20 Z" fill="none" stroke="#D3B775" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="95" r="18" fill="#D3B775" />
  </g>

  <!-- Large Title -->
  <text x="375" y="730" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="900" letter-spacing="6" fill="#F1E8D5" text-anchor="middle">LIBERAL</text>
  <text x="375" y="775" font-family="Georgia, serif" font-size="28" font-weight="bold" letter-spacing="8" fill="#D3B775" text-anchor="middle">PARTY</text>

  <!-- Official Metadata Box -->
  <g transform="translate(140, 830)">
    <rect x="0" y="0" width="470" height="120" rx="10" ry="10" fill="#142933" stroke="#D3B775" stroke-width="1.5" />
    <text x="25" y="38" font-family="Courier, monospace" font-size="16" fill="#88A5B3">STATUS: REICHSBÜRGER</text>
    <text x="25" y="68" font-family="Courier, monospace" font-size="16" fill="#88A5B3">CHARTA: VERFASSUNGSTREU</text>
    <text x="25" y="98" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#D3B775">REGISTER-NR: #L-1932-881</text>
  </g>
</svg>

