<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
  <defs>
    <filter id="leather-fascist" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#4F2320" surfaceScale="1.6" result="light">
        <feDistantLight azimuth="45" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Textured Book Cover -->
  <rect x="10" y="10" width="730" height="1030" rx="28" ry="28" fill="#331412" stroke="#210C0A" stroke-width="6" filter="url(#leather-fascist)" />

  <!-- Gold/Bronze Embossed Border -->
  <rect x="45" y="45" width="660" height="960" rx="18" ry="18" fill="none" stroke="#C49B5A" stroke-width="6" />
  <rect x="60" y="60" width="630" height="930" rx="12" ry="12" fill="none" stroke="#C49B5A" stroke-width="2" stroke-dasharray="10 5" />

  <!-- Top Inscription -->
  <text x="375" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="8" fill="#C49B5A" text-anchor="middle">PARTEIBUCH</text>
  <text x="375" y="185" font-family="'Times New Roman', serif" font-size="18" letter-spacing="4" fill="#B37873" text-anchor="middle">MITGLIEDSKARTE DER PARTEI</text>
  <line x1="180" y1="210" x2="570" y2="210" stroke="#C49B5A" stroke-width="2" />

  <!-- Center Seal -->
  <g transform="translate(375, 460) scale(1.1)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#C49B5A" stroke-width="4" />
    <circle cx="0" cy="0" r="145" fill="#240D0B" stroke="#C49B5A" stroke-width="1.5" stroke-dasharray="6 4" />
    <!-- Angular iron eagle with fasces -->
    <path d="M0 -90 L25 -40 L70 -50 L40 0 L90 20 L50 45 L70 95 L20 65 L0 110 L-20 65 L-70 95 L-50 45 L-90 20 L-40 0 L-70 -50 L-25 -40 Z" fill="#C49B5A" />
    <circle cx="0" cy="-35" r="18" fill="#240D0B" stroke="#C49B5A" stroke-width="3" />
  </g>

  <!-- Large Title -->
  <text x="375" y="730" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="900" letter-spacing="6" fill="#F1E8D5" text-anchor="middle">FASCIST</text>
  <text x="375" y="775" font-family="Georgia, serif" font-size="28" font-weight="bold" letter-spacing="8" fill="#C49B5A" text-anchor="middle">PARTY</text>

  <!-- Official Metadata Box -->
  <g transform="translate(140, 830)">
    <rect x="0" y="0" width="470" height="120" rx="10" ry="10" fill="#210A09" stroke="#C49B5A" stroke-width="1.5" />
    <text x="25" y="38" font-family="Courier, monospace" font-size="16" fill="#A86E69">KONTINGENT: REICHSKANZLEI</text>
    <text x="25" y="68" font-family="Courier, monospace" font-size="16" fill="#A86E69">VERPFLICHTUNG: ABSOLUT</text>
    <text x="25" y="98" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#C49B5A">MITGLIED-NR: #F-1932-409</text>
  </g>
</svg>

