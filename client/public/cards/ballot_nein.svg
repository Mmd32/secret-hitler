<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="100%" height="100%">
  <defs>
    <filter id="ballot-paper-n" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#F4EFE0" surfaceScale="1.4" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Paper Base -->
  <rect x="10" y="10" width="730" height="1030" rx="28" ry="28" fill="#F0E8D4" stroke="#CEC2A6" stroke-width="4" filter="url(#ballot-paper-n)" />

  <!-- Outer Woodblock Border -->
  <rect x="40" y="40" width="670" height="970" rx="20" ry="20" fill="none" stroke="#781D17" stroke-width="12" />
  <rect x="58" y="58" width="634" height="934" rx="14" ry="14" fill="none" stroke="#781D17" stroke-width="2" />

  <!-- Corner Flourishes -->
  <g fill="#781D17">
    <polygon points="46,46 76,46 46,76" />
    <polygon points="704,46 674,46 704,76" />
    <polygon points="46,1004 76,1004 46,974" />
    <polygon points="704,1004 674,1004 704,974" />
  </g>

  <!-- Top German Header -->
  <text x="375" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="8" fill="#781D17" text-anchor="middle">STIMMZETTEL</text>
  <line x1="160" y1="160" x2="590" y2="160" stroke="#781D17" stroke-width="2" />
  <text x="375" y="200" font-family="'Times New Roman', serif" font-size="20" letter-spacing="4" fill="#692C27" text-anchor="middle">REICHSTAGSWAHL 1932</text>

  <!-- Giant Stamped NEIN! -->
  <g transform="translate(375, 520)">
    <!-- Stamp box with slight ink distress -->
    <rect x="-260" y="-170" width="520" height="340" rx="16" ry="16" fill="none" stroke="#781D17" stroke-width="8" stroke-dasharray="140 4 80 4" />
    <rect x="-245" y="-155" width="490" height="310" rx="10" ry="10" fill="#E8DEC5" />
    
    <text x="0" y="70" font-family="Arial, 'Trebuchet MS', 'Arial Black', sans-serif" font-size="145" font-weight="900" letter-spacing="10" fill="#781D17" text-anchor="middle">NEIN!</text>
  </g>

  <!-- Stamped Seal in Crimson Ink -->
  <g transform="translate(375, 820)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#781D17" stroke-width="3" stroke-dasharray="8 4" opacity="0.8" />
    <text x="0" y="-20" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="3" fill="#781D17" text-anchor="middle" opacity="0.85">WAHLAUSSCHUSS</text>
    <text x="0" y="10" font-family="Georgia, serif" font-size="18" font-weight="bold" letter-spacing="4" fill="#781D17" text-anchor="middle">ABGELEHNT</text>
    <text x="0" y="35" font-family="Courier, monospace" font-size="12" letter-spacing="2" fill="#781D17" text-anchor="middle" opacity="0.75">BERLIN 1932</text>
  </g>

  <!-- Subtitle note -->
  <text x="375" y="960" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#7A4541" text-anchor="middle">« Ablehnung des Regierungsvorschlags »</text>
</svg>

