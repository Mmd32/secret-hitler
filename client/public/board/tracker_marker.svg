<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Woodgrain & radial shading for cylinder effect -->
    <radialGradient id="wood-pawn" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8C88B" />
      <stop offset="40%" stop-color="#C49B5A" />
      <stop offset="75%" stop-color="#805423" />
      <stop offset="100%" stop-color="#4A2A0C" />
    </radialGradient>
    <filter id="pawn-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="50" cy="54" rx="42" ry="40" fill="#000000" opacity="0.4" filter="url(#pawn-shadow)" />

  <!-- Outer Brass Ring -->
  <circle cx="50" cy="48" r="42" fill="#B38938" stroke="#5C4113" stroke-width="2" />
  <circle cx="50" cy="48" r="39" fill="url(#wood-pawn)" stroke="#E8C88B" stroke-width="1.5" />

  <!-- Recessed Inner Disk -->
  <circle cx="50" cy="48" r="30" fill="#3D210B" stroke="#B38938" stroke-width="2" />

  <!-- Center Weimar Eagle / Cross Inlay -->
  <g fill="#D4AF37" stroke="#FFE7A3" stroke-width="0.5">
    <!-- Center Diamond & Cross -->
    <path d="M 50 28 L 54 44 L 70 48 L 54 52 L 50 68 L 46 52 L 30 48 L 46 44 Z" />
    <circle cx="50" cy="48" r="4" fill="#FFE7A3" />
  </g>

  <!-- Top Specular Highlight -->
  <path d="M 22 36 A 34 34 0 0 1 78 36" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round" />
</svg>
